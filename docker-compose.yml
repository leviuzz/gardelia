# Servizi per lo SVILUPPO LOCALE (non per la produzione).
#   docker compose up -d
# - Postgres 16 con i ruoli floral_owner (migrazioni) e floral_app (runtime, soggetto a RLS)
#   e i database floral_dev / floral_test, creati al primo avvio.
# - Mailpit: cattura le email inviate dall'app (UI su http://localhost:8025).
services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: postgres
      # Password di sviluppo NOTA: il container espone la porta solo su localhost.
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/scripts:/floral-db-scripts:ro
      - ./packages/db/scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-floral.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
