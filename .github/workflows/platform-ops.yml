name: Operazioni di piattaforma

# Operazioni dell'amministratore sull'ambiente online, lanciate a mano da GitHub:
# Actions → "Operazioni di piattaforma" → Run workflow. Usa il database dell'ambiente online con il
# ruolo dell'app (segreto del repository PLATFORM_DATABASE_URL). Ogni operazione resta nel registro
# di audit. Guida: docs/DEPLOY_VERCEL.md.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione
        required: true
        type: choice
        options:
          - bootstrap-admin
          - assign-plan
          - grant-ai-credits
          - test-data
          - confirm-user
          - reset-two-factor
      email:
        description: La tua email (amministratore della piattaforma)
        required: true
        type: string
      person:
        description: Email della persona (confirm-user, reset-two-factor)
        required: false
        type: string
      tenant:
        description: Indirizzo della fioreria, la parte dopo /app/, non un'email (assign-plan, grant-ai-credits, test-data; facoltativo in confirm-user)
        required: false
        type: string
      role:
        description: Ruolo nella fioreria, solo se l'hai indicata (confirm-user)
        required: false
        type: choice
        default: MANAGER
        options:
          - MANAGER
          - STAFF
      plan:
        description: Piano (assign-plan)
        required: false
        type: choice
        default: PLUS
        options:
          - PLUS
          - BASIC
      status:
        description: Stato del piano (assign-plan)
        required: false
        type: choice
        default: PILOT
        options:
          - PILOT
          - TRIALING
          - ACTIVE
          - CANCELLED
      units:
        description: Anteprime AI extra da sbloccare (grant-ai-credits)
        required: false
        type: string
      note:
        description: Nota per il registro (senza dati personali)
        required: false
        type: string
      photos:
        description: Genera le foto dei fiori con l'AI (test-data, ~0,08 USD a foto)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: platform-ops
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Esegui l'operazione
        if: inputs.operation != 'test-data'
        # Il repository è pubblico: questi log li legge chiunque. Gli input si leggono dal file
        # dell'evento, mai da `env:` (GitHub stampa quelle variabili in chiaro all'inizio del passo)
        # né interpolati nello script; email, fioreria e nota si mascherano prima di ogni output.
        env:
          DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
        run: |
          set -euo pipefail
          input() { jq -r --arg name "$1" '.inputs[$name] | if . == null then "" else tostring end' "${GITHUB_EVENT_PATH}"; }
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; }
          # Anche in minuscolo: le CLI normalizzano le email e le maschere distinguono le maiuscole.
          EMAIL="$(input email)"; mask "${EMAIL}"; mask "${EMAIL,,}"
          TENANT="$(input tenant)"; mask "${TENANT}"; mask "${TENANT,,}"
          NOTE="$(input note)"; mask "${NOTE}"
          PERSON="$(input person)"; mask "${PERSON}"; mask "${PERSON,,}"
          OPERATION="$(input operation)"
          PLAN="$(input plan)"
          STATUS="$(input status)"
          UNITS="$(input units)"
          ROLE="$(input role)"
          if [ -z "${DATABASE_URL}" ]; then
            echo "Manca il segreto PLATFORM_DATABASE_URL (vedi docs/DEPLOY_VERCEL.md)." >&2
            exit 1
          fi
          # Un indirizzo di fioreria non contiene mai "@": un'email lì è finita nel campo sbagliato.
          if [[ "${TENANT}" == *@* ]]; then
            if [ "${OPERATION}" = "confirm-user" ] && [ -z "${PERSON}" ]; then
              echo "::notice::L'email scritta in «Indirizzo della fioreria» è usata come email della persona."
              PERSON="${TENANT}"; TENANT=""
            else
              echo "In «Indirizzo della fioreria» va la parte dopo /app/ (es. gardelias), non un'email." >&2
              exit 2
            fi
          fi
          if { [ "${OPERATION}" = "confirm-user" ] || [ "${OPERATION}" = "reset-two-factor" ]; } \
            && [ -z "${PERSON}" ]; then
            echo "Scrivi l'email della persona nel campo «Email della persona»." >&2
            exit 2
          fi
          note_args=()
          if [ -n "${NOTE}" ]; then note_args=(--note "${NOTE}"); fi
          case "${OPERATION}" in
            bootstrap-admin)
              pnpm -s platform:bootstrap-admin --email "${EMAIL}" ;;
            assign-plan)
              pnpm -s platform:assign-plan --operator "${EMAIL}" --tenant "${TENANT}" \
                --plan "${PLAN}" --status "${STATUS}" "${note_args[@]}" ;;
            grant-ai-credits)
              pnpm -s platform:grant-ai-credits --operator "${EMAIL}" --tenant "${TENANT}" \
                --units "${UNITS}" "${note_args[@]}" ;;
            confirm-user)
              tenant_args=()
              if [ -n "${TENANT}" ]; then tenant_args=(--tenant "${TENANT}" --role "${ROLE}"); fi
              pnpm -s platform:confirm-user --operator "${EMAIL}" --email "${PERSON}" \
                "${tenant_args[@]}" ;;
            reset-two-factor)
              # Solo dopo aver verificato chi è la persona (ADR-077).
              pnpm -s platform:reset-two-factor --operator "${EMAIL}" --email "${PERSON}" ;;
          esac
      - name: Dati di prova
        if: inputs.operation == 'test-data'
        # Clienti con date speciali, prodotti e (se ci sono i segreti di fal e dell'archivio R2,
        # gli stessi di Vercel) le foto dei fiori. Le chiavi arrivano solo a questo passo; gli
        # input, come sopra, dal file dell'evento e mascherati.
        env:
          DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          input() { jq -r --arg name "$1" '.inputs[$name] | if . == null then "" else tostring end' "${GITHUB_EVENT_PATH}"; }
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; }
          EMAIL="$(input email)"; mask "${EMAIL}"; mask "${EMAIL,,}"
          TENANT="$(input tenant)"; mask "${TENANT}"; mask "${TENANT,,}"
          PHOTOS="$(input photos)"
          if [ -z "${DATABASE_URL}" ]; then
            echo "Manca il segreto PLATFORM_DATABASE_URL (vedi docs/DEPLOY_VERCEL.md)." >&2
            exit 1
          fi
          photo_args=()
          if [ "${PHOTOS:-true}" = "true" ]; then
            if [ -n "${FAL_KEY}" ] && [ -n "${R2_ACCOUNT_ID}" ] && [ -n "${R2_BUCKET}" ] \
              && [ -n "${R2_ACCESS_KEY_ID}" ] && [ -n "${R2_SECRET_ACCESS_KEY}" ]; then
              export STORAGE_DRIVER=r2 AI_PROVIDER=fal
              photo_args=(--photos fal)
            else
              echo "::warning::Foto saltate: mancano i segreti FAL_KEY e R2_* (vedi docs/DEPLOY_VERCEL.md)."
            fi
          fi
          pnpm -s platform:test-data --operator "${EMAIL}" --tenant "${TENANT}" "${photo_args[@]}"
